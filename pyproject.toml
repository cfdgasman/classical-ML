[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mlaz"
version = "1.0.0"
description = "Shared helpers for the ML A-to-Z classical machine learning course"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib"]

[tool.setuptools]
packages = ["mlaz"]
